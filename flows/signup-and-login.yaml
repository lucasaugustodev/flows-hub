id: signup-and-login
description: Cria user novo via Supabase Auth (email+senha) e faz login
vars:
  - name: EMAIL
    resolver: mailtm.new
  - name: PASSWORD
    resolver: static
    args: { value: "Pw@2026!Hub" }
  - name: API_BASE
    resolver: env
    args: { name: API_BASE }
  - name: PORTAL
    resolver: env
    args: { name: PORTAL_BASE }
steps:
  - n: 1
    action: goto
    args: { url: "${PORTAL}/login" }

  - n: 2
    action: fill
    args:
      target: 'input[type=email]'
      value: "${EMAIL}"

  - n: 3
    action: fill
    args:
      target: 'input[type=password]'
      value: "${PASSWORD}"

  - n: 4
    action: click
    args: { text: "Entrar" }
    expect: { url_contains: "/onboarding" }

  # NOTE: step 5 requer captura do JWT após login (extract from localStorage).
  # O portal v2 armazena o token em localStorage após autenticação Supabase.
  # Será adicionado em uma sub-task ou no Task 5.2 (que invoca este flow).
