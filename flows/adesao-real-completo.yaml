id: adesao-real-completo
description: |
  Fluxo REAL 100%: autentica via Supabase API → injeta session no localStorage do portal-v2 →
  navega o funil de adesão JÁ logado → bate APIs do backend com trace correlation →
  audit_log linkado. Estratégia E2E padrão (login programático + UI autenticada).
vars:
  - name: USER_EMAIL
    resolver: static
    args: { value: "flowshub-e2e@deltajohnsons.com" }
  - name: USER_PASSWORD
    resolver: static
    args: { value: "FlowsHubE2E@2026!" }
  - name: USER_ID
    resolver: static
    args: { value: "ce1a603d-4209-453d-8cfa-ea35bfab7b0c" }
  # Login via API → JWT real assinado pelo Supabase
  - name: USER_JWT
    resolver: supabase.login
    args:
      email: "flowshub-e2e@deltajohnsons.com"
      password: "FlowsHubE2E@2026!"
steps:
  # ========== Sanity check: backend reconhece o JWT ==========
  - n: 1
    action: http.request
    args:
      method: GET
      url: "${API_BASE}/api/onboarding/status"
      headers:
        Authorization: "Bearer ${USER_JWT}"
    expect: { status: 200 }

  # ========== UI: vai pra origin do portal pra inicializar localStorage ==========
  - n: 2
    action: goto
    args:
      url: "${PORTAL_BASE}/login"
      waitUntil: domcontentloaded

  - n: 3
    action: screenshot

  # ========== Injeta session do Supabase v2 no localStorage ==========
  - n: 4
    action: eval
    args:
      script: |
        (() => {
          const jwt = '${USER_JWT}';
          const userId = '${USER_ID}';
          const email = '${USER_EMAIL}';
          const expSec = Math.floor(Date.now() / 1000) + 3600;
          const session = {
            access_token: jwt,
            refresh_token: 'flows-hub-injected',
            expires_at: expSec,
            expires_in: 3600,
            token_type: 'bearer',
            user: {
              id: userId,
              aud: 'authenticated',
              role: 'authenticated',
              email,
              email_confirmed_at: new Date().toISOString(),
              app_metadata: { provider: 'email', providers: ['email'] },
              user_metadata: {},
              created_at: new Date().toISOString(),
            },
          };
          const key = 'sb-amylxrskjhqwrlarqfcz-auth-token';
          localStorage.setItem(key, JSON.stringify(session));
          return { ok: true, key, hasToken: true };
        })()
      as: SESSION_INJECTED

  # ========== UI: navega autenticado pra selecao-turma ==========
  - n: 5
    action: goto
    args:
      url: "${PORTAL_BASE}/selecao-turma"
      waitUntil: networkidle

  - n: 6
    action: screenshot

  - n: 7
    action: eval
    args:
      script: |
        (() => {
          const url = location.href;
          const hasAuth = !!Object.keys(localStorage).find(k => k.includes('auth-token'));
          return { url, hasAuth };
        })()
      as: PAGE_SELECAO_TURMA

  # ========== BACKEND: iniciar adesão ==========
  - n: 8
    action: http.request
    args:
      method: POST
      url: "${API_BASE}/api/adesao/iniciar"
      headers:
        Authorization: "Bearer ${USER_JWT}"
      body: {}
    expect: { status: 201 }
    extract:
      ADESAO_ID: "$.id"

  - n: 9
    action: audit.assert_entry
    args:
      correlate_with_step: 8
      action: "post.api.adesao.iniciar"
      http_status: 201

  # ========== BACKEND: lista turmas disponíveis ==========
  - n: 10
    action: http.request
    args:
      method: GET
      url: "${API_BASE}/api/adesao/turmas"
      headers:
        Authorization: "Bearer ${USER_JWT}"
    expect: { status: 200 }

  - n: 11
    action: audit.assert_entry
    args:
      correlate_with_step: 10
      action: "get.api.adesao.turmas"
      http_status: 200

  # ========== BACKEND: estado da adesão criada ==========
  - n: 12
    action: http.request
    args:
      method: GET
      url: "${API_BASE}/api/adesao/${ADESAO_ID}"
      headers:
        Authorization: "Bearer ${USER_JWT}"
    expect: { status: 200 }

  # ========== BACKEND: aptidão financeira ==========
  - n: 13
    action: http.request
    args:
      method: GET
      url: "${API_BASE}/api/aptidao/status"
      headers:
        Authorization: "Bearer ${USER_JWT}"
    expect: { status: 200 }

  # ========== BACKEND: wallet HubCash ==========
  - n: 14
    action: http.request
    args:
      method: GET
      url: "${API_BASE}/api/wallet/saldo"
      headers:
        Authorization: "Bearer ${USER_JWT}"
    expect: { status: 200 }

  # ========== UI: navega meus contratos autenticado ==========
  - n: 15
    action: goto
    args:
      url: "${PORTAL_BASE}/meus-contratos"
      waitUntil: networkidle

  - n: 16
    action: screenshot

  # ========== UI: dashboard ==========
  - n: 17
    action: goto
    args:
      url: "${PORTAL_BASE}/dashboard"
      waitUntil: networkidle

  - n: 18
    action: screenshot

  - n: 19
    action: eval
    args:
      script: '({ url: location.href, title: document.title, body: document.body.innerText.slice(0,200) })'
      as: DASHBOARD_INFO
