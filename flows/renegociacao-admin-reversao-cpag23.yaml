id: renegociacao-admin-reversao-cpag23
name: Renegociacao Admin Reversao CPAG-2.3
description: |
  UI dedicado CPAG-2.3: cria uma renegociacao administrativa pelo flow base,
  abre a lista de renegociacoes no Backoffice, aciona a reversao pela interface,
  confirma com motivo obrigatorio e valida auditoria/estado final no banco.
vars:
  - name: ADMIN_EMAIL
    resolver: static
    args: { value: "claude-portal-1777646400@deltajohnsons.com" }
  - name: ADMIN_PASSWORD
    resolver: static
    args: { value: "FlowHub@2026!" }
  - name: ADMIN_JWT
    resolver: supabase.login
    args:
      email: "claude-portal-1777646400@deltajohnsons.com"
      password: "FlowHub@2026!"

steps:
  - n: 0
    action: http.request
    args:
      method: PATCH
      url: "${SUPABASE_URL}/rest/v1/planos?nome_plano=eq.Plano%20E2E%20Basico"
      headers:
        apikey: "${SUPABASE_SERVICE_ROLE_KEY}"
        Authorization: "Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
        Prefer: "return=minimal"
      body:
        financeiro:
          numeroMaximoParcelas: "12"
        pagamento:
          guardaFinanceira: "HUB_BELO_HORIZONTE"
          pix: true
          boleto: true
          cartao: true
          cartaoRecorrente: true
          cartaoParcelamentoEstendido: false
        alteracao:
          upgrade: true
          downgrade: true
        transferencia:
          transferencia: true
          dataInicioAlteracao: "2026-01-01"
          dataTerminoAlteracao: "2031-12-31"
        rescisao:
          configuracaoRegra: true
        contrato:
          modelo: "e2e"
          arquivos:
            - id: "1778500832437"
              url: "https://amylxrskjhqwrlarqfcz.supabase.co/storage/v1/object/public/contratos-planos/1778500831915_gu8zjq.pdf"
              nome: "TERMO INDIVIDUAL CODIGOS PORTAL HUB - E2E BACKFILL.pdf"
              tipo: "pdf"
              tamanho: "190.05 KB"
          requer_otp: false
    expect: { status: 204 }

  - n: 0.1
    action: http.request
    args:
      method: PATCH
      url: "${SUPABASE_URL}/rest/v1/turmas?codigo=eq.FH-E2E-1777758219774"
      headers:
        apikey: "${SUPABASE_SERVICE_ROLE_KEY}"
        Authorization: "Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
        Prefer: "return=minimal"
      body:
        dados_pagamento:
          guardaFinanceira: "HUB_BELO_HORIZONTE"
          numeroMaximoParcelas: "12"
          dataUltimaParcela: "2027-05-10"
          parcelamentoEstendido: "sem_taxas"
    expect: { status: 204 }

  - n: 1
    action: invoke_flow
    args: { flow: setup-user-com-contrato }

  - n: 2
    action: http.request
    args:
      method: POST
      url: "${SUPABASE_URL}/rest/v1/parcelas"
      headers:
        apikey: "${SUPABASE_SERVICE_ROLE_KEY}"
        Authorization: "Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
        Prefer: "return=minimal"
      body:
        contrato_id: "${CONTRATO_ID}"
        user_id: "${USER_ID}"
        numero_parcela: null
        tipo_parcela: "taxa_renegociacao"
        tipo: "taxa_renegociacao"
        valor: 50
        data_vencimento: "2026-01-10"
        status: "vencido"
        observacoes: "Taxa renegociacao vencida criada pelo Pageflows reversao CPAG-2.3"
        origem_fluxo: "pageflows_setup_admin_reversao"
        origem_tabela: "flows"
        origem_id: "${CONTRATO_ID}"
    expect: { status: 201 }

  - n: 3
    action: http.request
    args:
      method: POST
      url: "${API_BASE}/api/admin/replanejamento/aplicar"
      headers:
        Authorization: "Bearer ${ADMIN_JWT}"
      body:
        contratoId: "${CONTRATO_ID}"
        configuracao:
          numeroParcelas: 12
          diaVencimento: 10
          dataPrimeiraParcela: "2026-06-10"
          valorEntrada: 0
          parcelamentoEstendido: false
          numeroParcelasEstendidas: 0
          arrecadacaoAlternativa: false
          pularAcordoRenegociacao: false
          motivo: "Pageflows setup para testar reversao administrativa"
        idempotencyKey: "pageflows-reversao-admin-${CONTRATO_ID}"
    expect: { status: 201 }
    extract:
      RENEGOCIACAO_ID: "$.replanejamentoId"

  - n: 10
    action: goto
    args:
      url: "${PORTAL_BASE}/admin-login"
      waitUntil: networkidle

  - n: 11
    action: fill
    args:
      target: 'input[name=email]'
      value: "${ADMIN_EMAIL}"

  - n: 11.1
    action: fill
    args:
      target: 'input[name=password]'
      value: "${ADMIN_PASSWORD}"

  - n: 11.2
    action: click
    args:
      text: "Entrar no Sistema"

  - n: 11.3
    action: wait_ms
    args: { ms: 5000 }

  - n: 11.4
    action: eval
    args:
      script: |
        (() => {
          if (localStorage.getItem('isAdmin') !== 'true') {
            throw new Error('login admin nao marcou isAdmin=true');
          }
          return { ok: true, url: location.href };
        })()
      as: ADMIN_LOGIN_OK

  - n: 12
    action: goto
    args:
      url: "${PORTAL_BASE}/backoffice/gestao"
      waitUntil: networkidle

  - n: 13
    action: wait_ms
    args: { ms: 5000 }

  - n: 14
    action: eval
    args:
      script: |
        (() => {
          const norm = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
          const btn = [...document.querySelectorAll('button')]
            .find(b => norm(b.textContent).includes('renegociacoes'));
          if (!btn) {
            const buttons = [...document.querySelectorAll('button')].map(b => (b.textContent || '').trim()).filter(Boolean).slice(0, 80);
            throw new Error('aba Renegociacoes nao encontrada. Botoes: ' + JSON.stringify(buttons));
          }
          btn.scrollIntoView({ block: 'center' });
          btn.click();
          return { ok: true, text: btn.textContent.trim() };
        })()
      as: TAB_RENEGOCIACOES

  - n: 15
    action: wait_ms
    args: { ms: 2500 }

  - n: 16
    action: eval
    args:
      script: |
        (() => {
          const setValue = (el, value) => {
            const desc = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el), 'value');
            desc.set.call(el, value);
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.dispatchEvent(new Event('change', { bubbles: true }));
          };
          const input = [...document.querySelectorAll('input')]
            .find(i => /buscar por nome do aluno ou cpf/i.test(i.getAttribute('placeholder') || ''));
          if (!input) {
            const placeholders = [...document.querySelectorAll('input')].map(i => i.getAttribute('placeholder') || '').filter(Boolean);
            throw new Error('input de busca de renegociacoes nao encontrado. Placeholders: ' + JSON.stringify(placeholders));
          }
          setValue(input, '${USER_CPF}');
          const form = input.closest('form');
          const btn = form
            ? [...form.querySelectorAll('button')].find(b => /buscar/i.test(b.textContent || ''))
            : null;
          if (!btn) throw new Error('botao Buscar da lista nao encontrado');
          btn.click();
          return { ok: true, busca: input.value };
        })()
      as: BUSCA_RENEGOCIACAO

  - n: 17
    action: wait_ms
    args: { ms: 3000 }

  - n: 18
    action: eval
    args:
      script: |
        (() => {
          const body = document.body.innerText || '';
          if (!body.includes('${USER_CPF}') && !/Flow Hub Tester/i.test(body)) {
            throw new Error('renegociacao criada nao apareceu na lista. Texto: ' + body.slice(0, 1200));
          }
          const btn = [...document.querySelectorAll('button[title]')]
            .find(b => /reverter/i.test(b.getAttribute('title') || '') && !b.disabled);
          if (!btn) {
            const titles = [...document.querySelectorAll('button[title]')].map(b => b.getAttribute('title')).filter(Boolean);
            throw new Error('botao de reverter na lista nao encontrado. Titles: ' + JSON.stringify(titles));
          }
          btn.scrollIntoView({ block: 'center' });
          btn.click();
          return { ok: true, title: btn.getAttribute('title') };
        })()
      as: ABRIR_REVERSAO

  - n: 19
    action: wait_for
    args:
      text: "Detalhes da Renegocia"
      timeout: 30000

  - n: 20
    action: screenshot

  - n: 21
    action: eval
    args:
      script: |
        (async () => {
          const norm = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
          const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms));
          let btn = null;
          for (let i = 0; i < 60; i++) {
            btn = [...document.querySelectorAll('button')]
              .find(b => norm(b.textContent).includes('reverter renegociacao') && !b.disabled);
            if (btn) break;
            await wait(500);
          }
          if (!btn) {
            const buttons = [...document.querySelectorAll('button')].map(b => (b.textContent || '').trim()).filter(Boolean).slice(0, 80);
            const body = document.body.innerText || '';
            throw new Error('botao Reverter Renegociacao nao encontrado apos aguardar. Botoes: ' + JSON.stringify(buttons) + ' Texto: ' + body.slice(0, 1200));
          }
          btn.scrollIntoView({ block: 'center' });
          btn.click();
          return { ok: true };
        })()
      as: CLICK_REVERTER

  - n: 22
    action: wait_ms
    args: { ms: 800 }

  - n: 23
    action: eval
    args:
      script: |
        (() => {
          const setValue = (el, value) => {
            const desc = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el), 'value');
            desc.set.call(el, value);
            el.dispatchEvent(new Event('input', { bubbles: true }));
            el.dispatchEvent(new Event('change', { bubbles: true }));
          };
          const textarea = document.querySelector('textarea[placeholder*="motivo"], textarea');
          if (!textarea) throw new Error('textarea de motivo da reversao nao encontrado');
          setValue(textarea, 'Reversao Pageflows CPAG-2.3 validando backend e auditoria');
          return { ok: true, value: textarea.value };
        })()
      as: MOTIVO_REVERSAO

  - n: 24
    action: screenshot

  - n: 25
    action: eval
    args:
      script: |
        (() => {
          const norm = (s) => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim().toLowerCase();
          const btn = [...document.querySelectorAll('button')]
            .find(b => norm(b.textContent).includes('confirmar reversao') && !b.disabled);
          if (!btn) {
            const buttons = [...document.querySelectorAll('button')].map(b => ({
              text: (b.textContent || '').trim(),
              disabled: b.disabled,
            })).filter(b => b.text).slice(0, 80);
            throw new Error('botao Confirmar Reversao nao encontrado/habilitado. Botoes: ' + JSON.stringify(buttons));
          }
          btn.scrollIntoView({ block: 'center' });
          btn.click();
          return { ok: true };
        })()
      as: CONFIRMAR_REVERSAO

  - n: 26
    action: wait_for
    args:
      text: "RenegociaÃ§Ã£o revertida com sucesso"
      timeout: 30000

  - n: 27
    action: wait_ms
    args: { ms: 2500 }

  - n: 28
    action: screenshot

  - n: 30
    action: http.request
    args:
      method: GET
      url: "${SUPABASE_URL}/rest/v1/renegociacoes?id=eq.${RENEGOCIACAO_ID}&revertida=eq.true&select=id,revertida,revertida_em"
      headers:
        apikey: "${SUPABASE_SERVICE_ROLE_KEY}"
        Authorization: "Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
    expect: { status: 200 }

  - n: 31
    action: http.assert_json
    args:
      path: "$"
      minLength: 1
      message: "renegociacao admin deve ficar revertida=true apos reversao pela UI"

  - n: 32
    action: http.request
    args:
      method: GET
      url: "${SUPABASE_URL}/rest/v1/renegociacoes_audit?renegociacao_id=eq.${RENEGOCIACAO_ID}&acao=eq.reverter_admin&select=id,acao,observacao&limit=1"
      headers:
        apikey: "${SUPABASE_SERVICE_ROLE_KEY}"
        Authorization: "Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
    expect: { status: 200 }

  - n: 33
    action: http.assert_json
    args:
      path: "$"
      minLength: 1
      message: "reversao admin deve gravar auditoria reverter_admin"

  - n: 34
    action: http.request
    args:
      method: GET
      url: "${SUPABASE_URL}/rest/v1/parcelas?contrato_id=eq.${CONTRATO_ID}&origem_fluxo=eq.renegociacao_admin&origem_id=eq.${RENEGOCIACAO_ID}&status=eq.cancelado&motivo_cancelamento=eq.revertida_por_renegociacao_admin&select=id&limit=1"
      headers:
        apikey: "${SUPABASE_SERVICE_ROLE_KEY}"
        Authorization: "Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
    expect: { status: 200 }

  - n: 35
    action: http.assert_json
    args:
      path: "$"
      minLength: 1
      message: "parcelas novas da renegociacao devem ser canceladas pela reversao"
