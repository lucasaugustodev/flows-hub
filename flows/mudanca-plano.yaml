id: mudanca-plano
description: User com adesão existente solicita e executa mudança de plano
vars:
  - name: API_BASE
    resolver: env
    args: { name: API_BASE }
  - name: NEW_PLANO_ID
    resolver: env
    args: { name: SECONDARY_PLANO_ID }
steps:
  - n: 1
    action: invoke_flow
    args: { flow: adesao-completa }

  - n: 2
    action: http.request
    args:
      method: POST
      url: "${API_BASE}/api/mudanca-plano/preview"
      headers: { Authorization: "Bearer ${USER_JWT}" }
      body:
        contratoId: "${CONTRATO_ID}"
        planoId: "${NEW_PLANO_ID}"
    expect: { status: 201 }

  - n: 3
    action: http.request
    args:
      method: POST
      url: "${API_BASE}/api/mudanca-plano/solicitar"
      headers: { Authorization: "Bearer ${USER_JWT}" }
      body:
        contratoId: "${CONTRATO_ID}"
        planoId: "${NEW_PLANO_ID}"
    expect: { status: 201 }
    extract: { MP_ID: "$.id" }

  - n: 4
    action: http.request
    args:
      method: POST
      url: "${API_BASE}/api/mudanca-plano/${MP_ID}/executar"
      headers: { Authorization: "Bearer ${USER_JWT}" }
      body: {}
    expect: { status: 201 }

  - n: 5
    action: audit.assert_entry
    args:
      correlate_with_step: 4
      action: "post.api.mudanca-plano.:id.executar"
      http_status: 201
      status: success

  - n: 6
    action: db.read
    args:
      query: "select status from contratos where id = $1"
      params: ["${CONTRATO_ID}"]
    expect: { "rows[0].status": "ativo" }
