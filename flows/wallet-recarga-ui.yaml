id: wallet-recarga-ui
kind: ui-e2e
description: |
  Recarga HubCash via UI:
  1) setup-user-com-contrato (user com contrato ativo)
  2) inject session → /hubcash
  3) click "Adicionar Saldo" (abre modal)
  4) preenche valor R$ 100 + click "Pagar com PIX"
  5) PixModal abre com QR code, recarga aparece em "Pendente" no extrato
  6) verifica wallet_transactions: tipo=entrada, categoria=recarga_pix, valor=100
  Nota: confirmacao real do pagamento e webhook (Asaas/Omie) e fica fora do
  escopo deste teste UI. O importante e provar que UI gera a transacao
  e mostra no extrato.
steps:
  - n: 1
    action: invoke_flow
    args: { flow: setup-user-com-contrato }

  # ── INJETA SESSION ──────────────────────────────────────────
  - n: 10
    action: goto
    args:
      url: "${PORTAL_BASE}/login"
      waitUntil: domcontentloaded

  - n: 11
    action: eval
    args:
      script: |
        (() => {
          localStorage.setItem('sb-amylxrskjhqwrlarqfcz-auth-token', JSON.stringify({
            access_token: '${USER_JWT}',
            refresh_token: 'flows-hub-injected',
            expires_at: Math.floor(Date.now()/1000) + 3600,
            expires_in: 3600,
            token_type: 'bearer',
            user: {
              id: '${USER_ID}',
              aud: 'authenticated',
              role: 'authenticated',
              email: '${USER_EMAIL}',
              email_confirmed_at: new Date().toISOString(),
              app_metadata: { provider: 'email', providers: ['email'] },
              user_metadata: {},
              created_at: new Date().toISOString(),
            }
          }));
          return { ok: true };
        })()
      as: SESSION_INJECTED

  # ── NAVEGA HUBCASH ──────────────────────────────────────────
  - n: 12
    action: goto
    args:
      url: "${PORTAL_BASE}/hubcash"
      waitUntil: networkidle

  - n: 13
    action: wait_ms
    args: { ms: 4000 }

  - n: 14
    action: screenshot

  # Click "Adicionar Saldo" — abre modal de recarga
  - n: 15
    action: eval
    args:
      script: |
        (() => {
          const btns = [...document.querySelectorAll('button')]
            .filter(b => /adicionar saldo/i.test(b.textContent.trim()) && !b.disabled);
          if (!btns.length) {
            const all = [...document.querySelectorAll('button')].map(b => b.textContent.trim()).filter(Boolean);
            throw new Error('Adicionar Saldo button not found. visible: ' + JSON.stringify(all.slice(0, 20)));
          }
          btns[0].scrollIntoView({ block: 'center' });
          btns[0].click();
          return { ok: true };
        })()
      as: ADICIONAR_SALDO_CLICKED

  - n: 16
    action: wait_ms
    args: { ms: 1500 }

  - n: 17
    action: screenshot

  # Preenche valor R$ 100,00 (input com formatação cents → "100,00")
  - n: 18
    action: eval
    args:
      script: |
        (() => {
          // Input de valor é text type com formatação. Simular digitação dos cents (10000).
          const inputs = [...document.querySelectorAll('input')].filter(i => !i.disabled && i.offsetParent !== null);
          const valInput = inputs.find(i => /^\d/.test(i.value || '') || /valor/i.test((i.placeholder||'') + (i.name||'')));
          if (!valInput) throw new Error('valor input not found. inputs: ' + inputs.length);
          const setter = Object.getOwnPropertyDescriptor(window.HTMLInputElement.prototype, 'value').set;
          // o handler converte via /\D/g.replace e divide por 100. Pra ter 100,00 manda "10000"
          setter.call(valInput, '10000');
          valInput.dispatchEvent(new Event('input', { bubbles: true }));
          return { ok: true, value: valInput.value };
        })()
      as: VALOR_FILLED

  - n: 19
    action: wait_ms
    args: { ms: 500 }

  # Click "Pagar com PIX"
  - n: 20
    action: eval
    args:
      script: |
        (() => {
          const btns = [...document.querySelectorAll('button')]
            .filter(b => /pagar com pix/i.test(b.textContent.trim()) && !b.disabled);
          if (!btns.length) throw new Error('Pagar com PIX button not found');
          btns[0].click();
          return { ok: true };
        })()
      as: PAGAR_PIX_CLICKED

  - n: 21
    action: wait_ms
    args: { ms: 5000 }

  - n: 22
    action: screenshot

  # ── VERIFICAÇÃO via Supabase ──────────────────────────────
  # Recarga foi gerada — tipo=entrada, categoria=recarga_pix, valor=100
  # Status comeca como 'pendente' (webhook bancario confirmaria em prod)
  - n: 23
    action: http.request
    args:
      method: GET
      url: "${SUPABASE_URL}/rest/v1/wallet_transactions?user_id=eq.${USER_ID}&order=created_at.desc&limit=1&select=id,valor,status,tipo,categoria"
      headers:
        apikey: "${SUPABASE_SERVICE_ROLE_KEY}"
        Authorization: "Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
    expect: { status: 200 }
