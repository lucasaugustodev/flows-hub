id: pagamento-parcela-boleto
kind: ui-e2e
description: |
  Pagamento de parcela via UI (Boleto Bancário):
  1) setup-user-com-contrato (user com contrato + parcelas pendentes)
  2) inject session → /meus-pagamentos
  3) click "Pagar" na primeira parcela → PaymentModal
  4) click "Boleto Bancário" → handleGerarBoleto → BoletoModal abre
  5) verifica boleto criado em tabela boletos via Supabase
  Nota: compensação real do boleto leva até 3 dias úteis (banco).
  UI E2E valida que a geração funcionou.
steps:
  - n: 1
    action: invoke_flow
    args: { flow: setup-user-com-contrato }

  # ── INJETA SESSION ──────────────────────────────────────────
  - n: 10
    action: goto
    args:
      url: "${PORTAL_BASE}/login"
      waitUntil: domcontentloaded

  - n: 11
    action: eval
    args:
      script: |
        (() => {
          localStorage.setItem('sb-amylxrskjhqwrlarqfcz-auth-token', JSON.stringify({
            access_token: '${USER_JWT}',
            refresh_token: 'flows-hub-injected',
            expires_at: Math.floor(Date.now()/1000) + 3600,
            expires_in: 3600,
            token_type: 'bearer',
            user: {
              id: '${USER_ID}',
              aud: 'authenticated',
              role: 'authenticated',
              email: '${USER_EMAIL}',
              email_confirmed_at: new Date().toISOString(),
              app_metadata: { provider: 'email', providers: ['email'] },
              user_metadata: {},
              created_at: new Date().toISOString(),
            }
          }));
          return { ok: true };
        })()
      as: SESSION_INJECTED

  - n: 12
    action: goto
    args:
      url: "${PORTAL_BASE}/meus-pagamentos"
      waitUntil: networkidle

  - n: 13
    action: wait_ms
    args: { ms: 5000 }

  - n: 14
    action: screenshot

  # Click "Pagar" na primeira parcela pendente
  - n: 15
    action: eval
    args:
      script: |
        (() => {
          const btns = [...document.querySelectorAll('button')]
            .filter(b => b.textContent.trim() === 'Pagar' && !b.disabled);
          if (!btns.length) throw new Error('Pagar button not found');
          btns[0].scrollIntoView({ block: 'center' });
          btns[0].click();
          return { ok: true };
        })()
      as: PAGAR_CLICKED

  - n: 16
    action: wait_ms
    args: { ms: 2000 }

  - n: 17
    action: screenshot

  # PaymentModal aberto → click "Boleto Bancário"
  - n: 18
    action: eval
    args:
      script: |
        (() => {
          const btns = [...document.querySelectorAll('button')]
            .filter(b => {
              const h4 = b.querySelector('h4');
              return h4 && /boleto banc[áa]rio/i.test(h4.textContent.trim());
            });
          if (!btns.length) {
            const headings = [...document.querySelectorAll('h4')].map(h => h.textContent.trim());
            throw new Error('Boleto option not found. h4: ' + JSON.stringify(headings));
          }
          btns[0].click();
          return { ok: true };
        })()
      as: BOLETO_OPTION_CLICKED

  - n: 19
    action: wait_ms
    args: { ms: 30000 }

  - n: 20
    action: screenshot

  # ── VERIFICAÇÃO via Supabase ──────────────────────────────
  - n: 30
    action: http.request
    args:
      method: GET
      url: "${SUPABASE_URL}/rest/v1/boletos?user_id=eq.${USER_ID}&order=created_at.desc&limit=3&select=id,valor,status,linha_digitavel,created_at"
      headers:
        apikey: "${SUPABASE_SERVICE_ROLE_KEY}"
        Authorization: "Bearer ${SUPABASE_SERVICE_ROLE_KEY}"
    expect: { status: 200 }

  - n: 31
    action: http.assert_json
    args:
      path: "$"
      minLength: 1
      message: "boleto deve ser criado no backend"

  - n: 32
    action: http.assert_json
    args:
      path: "$[0].id"
      not_empty: true
      message: "boleto criado deve ter id"

  - n: 33
    action: http.assert_json
    args:
      path: "$[0].linha_digitavel"
      not_empty: true
      message: "boleto criado deve ter linha digitavel"
